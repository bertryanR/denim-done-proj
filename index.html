<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Denim + Done</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">  <!-- Splide CSS -->
  </head>
  <body>
    <section> 
      <!-- HERO -->  
      <div class="hero">
        <h1 class="visually-hidden">Denim & Done</h1>
        <div class="delivery-strip"><a href="/shop/ja-new-in-all" aria-label="FREE DELIVERY WHEN YOU SPEND $99+">Free delivery when you spend $99+</a>
        </div>
        <div class="hero-img-dt"> <!--DT-->
            <img class="hero-dt" src="Images/MJ_1UP_Hero_DT.jpg" alt="Denim & Done">
            <a class="hero-img-link" href="/shop/ja-new-in-all"></a>
        </div>
        <div class="hero-img-mb"> <!--MB-->
            <img class="hero-dt" src="Images/MJ_1UP_Hero_MB.jpg" alt="Denim & Done">
            <a class="hero-img-link" href="/shop/ja-new-in-all"></a>
        </div> 
        <div class="hero-ctas"> <!-- HERO CTA-->  
          <a class="hero-cta" href="/shop/ja-girls-new-all">Girls New</a>
          <a class="hero-cta" href="/shop/ja-guys-new-all">Guys New</a>
        </div>
      </div>
        <!--BOGO --> 
      <div class="bogo"> <!--BOGO DT-->
        <img src="Images/MJ_1UP_Slim_DT.jpg" alt="Buy one, Get one 50% off all"> 
        <a class="bogo-link" href="/shop/ja-new-in-all"></a>
      </div>
      <div class="bogo-mb"> <!--BOGO MB-->
        <img src="Images/MJ_1UP_Slim_MB.jpg" alt="Buy one, Get one 50% off all"> 
        <a class="bogo-link" href="/shop/ja-new-in-all"></a>
      </div>

      <!---CATEGORY-->
      <div class="cat">
        <div class="cat-grid">
          <div class="cat-grid-item">
            <img src="Images/MJ_4UP_01.jpg" alt="Tees">
            <a class="shop-girls-link" href="/shop/ja-graphic-tees"></a> <!-----I would confirm this slug since the word 'girls' is missing unlike others-->
            <a class="shop-guys-link" href="/shop/ja-guys-graphic-tee"></a>
          </div>
          <div class="cat-grid-item">
            <img src="Images/MJ_4UP_02.jpg" alt="Sweats">
            <a class="shop-girls-link" href="/shop/ja-girls-hoodies-sweats"></a>
            <a class="shop-guys-link" href="/shop/ja-guys-hoodies-sweats"></a>
          </div>
          <div class="cat-grid-item">
            <img src="Images/MJ_4UP_03.jpg" alt="Jackets">
            <a class="shop-girls-link" href="/shop/ja-girls-jackets"></a>
            <a class="shop-guys-link" href="/shop/ja-guys-jackets"></a>
          </div>
          <div class="cat-grid-item">
            <img src="Images/MJ_4UP_04.jpg" alt="Shirts">
            <a class="shop-link" href="/shop/ja-guys-shirts"></a>
          </div>
        </div> 
      </div>
      <!--DEALS-->
      <div class="deals-grid"> 
        <div class="deals-grid-item">
            <img src="Images/MJ_2UP_Slim_01.jpg" alt="selected girls sweats and tracks">
            <a href="/shop/ja-deals-girls" class="deals-bottom-link"></a>
        </div>
        <div class="deals-grid-item">
            <img src="Images/MJ_2UP_Slim_02.jpg" alt="selected guys jeans">
            <a href="/shop/ja-guys-deals-all" class="deals-bottom-link"></a>
        </div>
      </div>
      <!--DENIM-->
      <div class="denim-grid">
          <div class="denim-grid-item">
            <img src="Images/MJ_2UP_Stack_01_DT.jpg" alt="Girls Denim">  <!---I use the same Image for both DT and BT since they the same-->
            <a class="girls-denim-link" href="/shop/ja-girls-denim"></a>
          </div>
          <div class="denim-grid-item">
            <img src="Images/MJ_2UP_Stack_02_DT.jpg" alt="Guys Denim"> <!---I use the same Image for both DT and BT since they the same-->
            <a class="guys-denim-link" href="/shop/ja-guys-denim"></a>
          </div>
      </div>

      <!---MERCH CAROUSEL-->
      <div class="merch">
          <h3>Your Merch Destination</h3>
          <div class="splide" aria-label="Your Merch Destination">
            <div class="splide__track">
              <ul class="splide__list">
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_GhostFace.png" alt="Ghost Face"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_JujutsuKaisen.png" alt="Jujutsu Kaisen"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_MelanieMartinez.png" alt="Melanie Martinez"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_Metallica.png" alt="Metallica"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_OnePiece.png" alt="One Piece"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_Sanrio.png" alt="Sanrio"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_Slipknot.png" alt="Slipknot"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_Stitch.png" alt="Disney Stitch"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_Tupac.png" alt="Tupac"></a></div>
                </li>
                <li class="splide__slide">
                  <div class="logo"><a href="/shop/ja-licensed-all"><img src="Images/MJ_Logo_Twilight.png" alt="Twilight"></a></div>
                </li>
              </ul>
            </div>
          </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js">
    </script>
    <script src="script.js"></script>
  </body>
</html>
